name: FPL Automated Tactical Engine & Comparison

on:
  workflow_dispatch:
    inputs:
      manual_trigger:
        description: 'Run Type'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - pre_gameweek_deadline
          - post_gameweek_review
      xmins_input:
        description: 'xMins Overrides (e.g., Haaland:0, Saka:45)'
        required: false
        type: string

jobs:
  run-fpl-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pulp google-genai ddgs scipy numpy

      - name: Run Main FPL Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MANUAL_TRIGGER: ${{ github.event.inputs.manual_trigger }}
          ACTIVE_CHIP: ${{ secrets.ACTIVE_CHIP }} 
          XMINS_INPUT: ${{ github.event.inputs.xmins_input }}
        run: python fpl_bot.py
