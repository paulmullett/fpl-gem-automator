name: FPL Ensemble Engine

on:
  workflow_dispatch:

jobs:
  run-ensemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests pulp

      - name: Run Ensemble Script
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
        run: python fpl_ensemble.py
