name: FPL Automated Tactical Engine

on:
  schedule:
    - cron: '0 8 * * 1,5' # Background baseline checks
  workflow_dispatch:
    inputs:
      execution_mode:
        description: 'Select Tactical Execution Mode'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - post_gameweek_review
          - pre_gameweek_deadline

jobs:
  run-fpl-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests google-genai ddgs pulp

      - name: Execute FPL Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          MANUAL_TRIGGER: ${{ inputs.execution_mode || 'auto' }}
        run: python fpl_bot.py

      - name: Commit State Persistence File
        run: |
          git config --global user.name 'fpl-bot-autocommit'
          git config --global user.email 'fpl-bot@users.noreply.github.com'
          git add fpl_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update FPL strategic state memory [skip ci]" && git push)
