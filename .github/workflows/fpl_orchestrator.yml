name: FPL Master Quantitative Bot

on:
  # 1. CRON SCHEDULE: Runs completely autonomously twice a week
  schedule:
    - cron: '0 18 * * 4'  # Thursday evenings (Pre-weekend prep)
    - cron: '0 20 * * 0'  # Sunday evenings (Post-weekend review)

  # 2. HUMAN-IN-THE-LOOP: Manual trigger with control panel inputs
  workflow_dispatch:
    inputs:
      run_type:
        description: 'Oracle Directives: What type of analysis is this?'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - pre_gameweek_deadline
          - post_gameweek_review
      active_chip:
        description: 'Deploy an FPL Chip this Gameweek?'
        required: true
        default: 'NONE'
        type: choice
        options:
          - NONE
          - WILDCARD
          - FREE_HIT
          - BENCH_BOOST
          - TRIPLE_CAPTAIN
      xmins_input:
        description: 'Human Overrides (e.g. saka:0, haaland:60)'
        required: false
        default: ''
        type: string
      risk_posture:
        description: 'Strategic Risk Posture'
        required: true
        default: 'NEUTRAL'
        type: choice
        options:
          - NEUTRAL
          - SHIELD
          - CHASE

jobs:
  run-fpl-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ML Data Pipeline
        env:
          WEBSHARE_PROXY: ${{ secrets.WEBSHARE_PROXY }}
        run: python run_ml_pipeline.py

      - name: Execute MILP Solver & Discord Oracle
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          MANUAL_TRIGGER: ${{ github.event.inputs.run_type || 'auto' }}
          ACTIVE_CHIP: ${{ github.event.inputs.active_chip || 'NONE' }}
          XMINS_INPUT: ${{ github.event.inputs.xmins_input || '' }}
          RISK_POSTURE: ${{ github.event.inputs.risk_posture || 'NEUTRAL' }}
          WEBSHARE_PROXY: ${{ secrets.WEBSHARE_PROXY }}
        run: python fpl_bot.py
        
      - name: Commit Updated State Files (fpl_state.json & ml_projections.json)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add fpl_state.json ml_projections.json
          git commit -m "Auto-update state and ML projections [skip ci]" || echo "No changes to commit"
          git push