name: FPL Master Quantitative Bot

on:
  schedule:
    - cron: '0 18 * * 4' # Thursday evenings (Pre-weekend prep)
    - cron: '0 20 * * 0' # Sunday evenings (Post-weekend review)
  workflow_dispatch:
    inputs:
      run_type:
        description: 'Oracle Directives: What type of analysis is this?'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - pre_gameweek_deadline
          - post_gameweek_review
      active_chip:
        description: 'Deploy an FPL Chip this Gameweek?'
        required: true
        default: 'NONE'
        type: choice
        options:
          - NONE
          - WILDCARD
          - FREE_HIT
          - BENCH_BOOST
          - TRIPLE_CAPTAIN
      xmins_input:
        description: 'Human Overrides (e.g. saka:0, haaland:60)'
        required: false
        default: ''
        type: string
      risk_posture:
        description: 'Strategic Risk Posture'
        required: true
        default: 'NEUTRAL'
        type: choice
        options:
          - NEUTRAL
          - SHIELD
          - CHASE
      debug_mode:
        description: 'Enable Raw Mathematical Debug Trace'
        required: false
        default: false
        type: boolean

jobs:
  run-fpl-bot:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Dependencies
        run: |
          python3 -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install -r requirements.txt
          venv/bin/python -m playwright install chromium

      - name: Run Dedicated Price Oracle Scraper
        run: venv/bin/python scrape_prices.py

      - name: Run ML Data Pipeline
        env:
          XMINS_INPUT: ${{ github.event.inputs.xmins_input || '' }}
        run: venv/bin/python run_ml_pipeline.py

      - name: Execute MILP Solver & Discord Oracle
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MANUAL_TRIGGER: ${{ github.event.inputs.run_type || 'auto' }}
          ACTIVE_CHIP: ${{ github.event.inputs.active_chip || 'NONE' }}
          XMINS_INPUT: ${{ github.event.inputs.xmins_input || '' }}
          RISK_POSTURE: ${{ github.event.inputs.risk_posture || 'NEUTRAL' }}
          DEBUG_MODE: ${{ github.event.inputs.debug_mode || 'false' }}
        run: venv/bin/python fpl_bot.py

      - name: Commit Updated State Files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add -f fpl_state.json ml_projections.json
          git commit -m "Auto-update state and ML projections [skip ci]" || echo "No changes to commit"
          git push